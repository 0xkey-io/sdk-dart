name: zeroxkey_oss
description: Public monorepo for ZeroXKey SDK & API
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.6.0 <4.0.0"

workspace:
  # Security patch line for zeroxkey_sdk_flutter 0.1.x: only the Flutter SDK is
  # in the workspace, so its zeroxkey_* dependencies resolve to the versions
  # published on pub.dev, exactly as they do for apps on 0.1.0.
  - packages/sdk-flutter

dev_dependencies:
  melos: 7.1.1

scripts:
  test: melos exec -- dart test
  test:flutter: melos exec -- flutter test
